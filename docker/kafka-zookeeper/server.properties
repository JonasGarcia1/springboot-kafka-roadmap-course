# Kafka 3.9 en modo ZooKeeper: configuración intencionalmente legacy para el curso.
# Identidad del nodo dentro del cluster. El laboratorio tiene un único broker.
broker.id=1
listeners=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
advertised.listeners=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
# Kafka 3.9 aún permite registrar metadatos en ZooKeeper; Kafka 4+ usa KRaft.
zookeeper.connect=zookeeper:2181
log.dirs=/tmp/kafka-logs
# Valor por defecto para topics; los topics del código lo declaran explícitamente también.
num.partitions=3
auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
